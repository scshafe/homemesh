# The Xcode project is generated from this spec by XcodeGen (version pinned in
# .github/workflows/ci.yml); the .xcodeproj is not committed.
#   xcodegen generate --spec ios/project.yml
# It is unsigned (DEVELOPMENT_TEAM is empty): CI builds for the simulator. To run
# on an iPhone, a git-ignored ios/project.local.yml includes this file and adds
# your team and bundle id (ios/project.local.yml.example; ios/README.md).
name: HomemeshCapture
options:
  bundleIdPrefix: com.scshafe
  # bakes the commit and a build number in (git-ignored generated files); see ios/stamp-build
  preGenCommand: bash "$(git rev-parse --show-toplevel)/ios/stamp-build"
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Build.generated.xcconfig     # CURRENT_PROJECT_VERSION, written by ios/stamp-build
  Release: Build.generated.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Swift 6 data-race checking as warnings now (CI turns warnings into errors), so the
    # move to the Swift 6 language mode is a version bump, not a rewrite.
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The app's bundle id; ios/project.local.yml can override it.
    HOMEMESH_BUNDLE_ID: com.scshafe.homemesh-capture
targets:
  HomemeshCapture:
    type: application
    platform: iOS
    sources: [HomemeshCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOMEMESH_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "homemesh"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera and LiDAR scan the rooms of your home."
        INFOPLIST_KEY_NSMotionUsageDescription: "The barometer tells which floor of your home a room is on."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UIFileSharingEnabled: YES            # the saved scans show up in the Files app
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  HomemeshCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HomemeshCaptureTests
      - path: ../tests/fixtures      # the committed synthetic houses: the contract test decodes them
        buildPhase: resources
    dependencies:
      - target: HomemeshCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HOMEMESH_BUNDLE_ID).tests
schemes:
  HomemeshCapture:
    run:
      # Xcode Run turns Metal API validation and GPU frame capture on by default; RoomPlan's renderer can trip an
      # assertion under them that a normal launch never hits (a freeze at the start of the second room).
      enableGPUValidationMode: false
      enableGPUFrameCaptureMode: disabled
    build:
      targets:
        HomemeshCapture: all
    test:
      targets: [HomemeshCaptureTests]
