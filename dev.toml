# Project intent (BASE-01). The schema is illustrative until M2/M7 fix it.
schema_version = 1

[project]
id = "homemesh"
class = "managed"

# Not deployed any more (see [deploy]); kept as a service-kind project because the Python engine and its tests are the oracle for the Swift core.
[app]
kind = "service"

# BASE-06: the one command that verifies this repository, run from its root
# by .github/workflows/ci.yml and by hand on the checkout under review. Keep
# the two equal.
[verify]
command = "./scripts/verify"

# The server was retired on 2026-11-05 (docs/design-standalone-app.md section 7): nothing is deployed. The iPhone app keeps its houses on
# the phone, and this repository is the app (ios/), the on-device engine (core/) and the Python engine kept as its test oracle.
[deploy]
lane = "none"

[skills]
# BASE-05 asks for .agents/skills; the catalog is M4. Recorded gap.
selected = []

# Adopted, not generated (D-6): `dev adopt --add-missing` added this file to
# an existing service on 2026-10-20. It records which scshafe-dev standard the
# repository was adopted under; it does not claim scshafe-dev rendered this
# repository's files, and the ones that existed were left as they are.
[template]
source = "scshafe/scshafe-dev"
version = "0.14.0"
commit = "1c3329871cb04f7ea4aedd96175e01c8c3bbda6b"
released = true
dirty = false
mode = "adopted"
params = { kind = "service", name = "homemesh", date = "2026-10-20" }

# IDENT-01: what this project's agent may do (scshafe/infra docs/platform/agent-identity.md).
# References, never secrets. `dev identity plan` compares it with the host and GitHub.
[identity]
agent = "agent-homemesh"
github = ["contents=write", "pull_requests=write", "issues=write", "workflows=write", "actions=write"]
docker = true
